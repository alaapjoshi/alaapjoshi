<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--a:#7DE3FF;--b:#B28CFF;--glow:125,227,255}
html,body{width:1280px;height:400px}
body{color:#F5F7FF;font-family:-apple-system,"SF Pro Display","SF Pro Text",Inter,"Helvetica Neue",sans-serif;overflow:hidden;position:relative;
background:
 radial-gradient(60% 90% at 8% 0%,rgba(124,77,255,.75) 0%,transparent 60%),
 radial-gradient(55% 90% at 100% 10%,rgba(30,140,255,.65) 0%,transparent 60%),
 radial-gradient(70% 80% at 55% 125%,rgba(20,210,170,.55) 0%,transparent 65%),
 radial-gradient(40% 70% at 0% 100%,rgba(255,80,170,.35) 0%,transparent 70%),#070A1C}
body:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.05),transparent 35%,transparent 65%,rgba(255,255,255,.04))}
.glass{position:absolute;left:48px;right:48px;top:48px;bottom:48px;border-radius:30px;padding:0 56px;display:flex;flex-direction:column;justify-content:center;
background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 30px 80px rgba(0,0,0,.45),0 0 60px rgba(var(--glow),.12)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin-bottom:12px}
h1{font-size:80px;line-height:1;font-weight:800;letter-spacing:-3px;background:linear-gradient(90deg,#fff,var(--a));-webkit-background-clip:text;color:transparent;padding-bottom:4px}
p{font-size:22px;line-height:1.4;margin:14px 0 22px;color:rgba(235,240,255,.7);max-width:900px}
.chip{display:inline-block;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#EAF2FF;font-weight:600;font-size:16px;margin:0 8px 0 0}
</style></head><body>
